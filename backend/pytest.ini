# ============================================================
# backend/pytest.ini
# Pytest configuration (Phase 9 — CI gate).
#
# WHY: backend code imports modules like `from config import settings`
# as top-level packages. `pythonpath = .` puts backend/ on sys.path so
# `import config` / `import llmops.router` resolve from anywhere, and
# `testpaths` scopes the run to backend/tests/ only.
#
# Run:  .venv/bin/python -m pytest   (from backend/)
# This suite is DETERMINISTIC and headless — no DB, Docker or Ollama.
# ============================================================
[pytest]
testpaths = tests
pythonpath = .
addopts = -q --disable-warnings